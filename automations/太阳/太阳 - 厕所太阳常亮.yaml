description: ''
trigger:
- platform: time_pattern
  seconds: '0'
  minutes: / 2
condition: []
action:
- service: light.turn_on
  data:
    kelvin: '{{ cos((now().hour + now().minute/60 - 12) / 7 * 3.14 / 2) * 1600 + 4800 }}'
    brightness_pct: '{{ min(100, max(0, cos((now().hour + now().minute/60 - 13.5) / 10 * 3.14 / 2)) * 75 + 35) }}'
  target:
    entity_id: 不许看！
mode: single
