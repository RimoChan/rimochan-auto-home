description: ''
trigger:
- platform: time_pattern
  minutes: /1
condition: []
action:
- variables:
    当前温度: '{{ float(states(''sensor.pi_temperature'')) }}'
    目标温度: '{{ float(states(''不许看！'')) }}'
- choose:
  - conditions:
    - condition: and
      conditions:
      - condition: device
        type: is_on
        device_id: 不许看！
        entity_id: 不许看！
        domain: switch
      - condition: template
        value_template: '{{ 当前温度 > 目标温度 - 0.2 }}'
    sequence:
    - service: climate.turn_off
      data: {}
      target:
        device_id: 不许看！
  - conditions:
    - condition: and
      conditions:
      - condition: device
        type: is_off
        device_id: 不许看！
        entity_id: 不许看！
        domain: switch
      - condition: template
        value_template: '{{ 当前温度 < 目标温度 - 0.4 }}'
    sequence:
    - service: climate.turn_on
      data: {}
      target:
        device_id: 不许看！
mode: single
