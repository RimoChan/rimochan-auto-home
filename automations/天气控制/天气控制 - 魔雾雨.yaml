description: ''
trigger:
- platform: time_pattern
  minutes: /3
condition:
- condition: device
  type: is_on
  device_id: 不许看！
  entity_id: 不许看！
  domain: humidifier
- condition: numeric_state
  entity_id: sensor.pi_luminance
  above: 10
action:
- if:
  - condition: and
    conditions: []
  then:
  - service: switch.turn_off
    data: {}
    target:
      entity_id: 不许看！
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.pi_humidity
        above: 38
      sequence:
      - service: humidifier.set_mode
        data:
          mode: Level1
        target:
          entity_id: 不许看！
    - conditions:
      - condition: numeric_state
        entity_id: sensor.pi_humidity
        above: 32
        below: 38
      sequence:
      - service: humidifier.set_mode
        data:
          mode: Level2
        target:
          entity_id: 不许看！
    - conditions:
      - condition: numeric_state
        entity_id: sensor.pi_humidity
        below: 32
      sequence:
      - service: humidifier.set_mode
        data:
          mode: Level3
        target:
          entity_id: 不许看！
  else:
  - service: switch.turn_off
    data: {}
    target:
      entity_id: 不许看！
  - service: humidifier.turn_off
    data: {}
    target:
      entity_id: 不许看！
mode: single
